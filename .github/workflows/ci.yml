name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  bff:
    name: BFF typecheck + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crm-bff
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: crm-bff/package-lock.json
      # @docengine/* is normally file:../../docEngine (sibling). Point at in-repo CI stubs
      # so BFF installs work without a DocEngine checkout.
      - name: Point DocEngine deps at CI stubs
        run: |
          node -e "
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          p.dependencies['@docengine/editor'] = 'file:../ci/stubs/docengine-editor';
          p.dependencies['@docengine/engine'] = 'file:../ci/stubs/docengine-engine';
          p.dependencies['@docengine/pdf-renderer'] = 'file:../ci/stubs/docengine-pdf-renderer';
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          "
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  unit:
    name: App unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      # @docengine/* is normally file:../docEngine (sibling). Point at in-repo CI stubs
      # so installs work without publishing DocEngine.
      - name: Point DocEngine deps at CI stubs
        run: |
          node -e "
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          p.dependencies['@docengine/editor'] = 'file:./ci/stubs/docengine-editor';
          p.dependencies['@docengine/field-date'] = 'file:./ci/stubs/docengine-field-date';
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          "
      - run: npm install --no-audit --no-fund
      - run: npm test

  build:
    name: App build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Point DocEngine deps at CI stubs
        run: |
          node -e "
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          p.dependencies['@docengine/editor'] = 'file:./ci/stubs/docengine-editor';
          p.dependencies['@docengine/field-date'] = 'file:./ci/stubs/docengine-field-date';
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          "
      - run: npm install --no-audit --no-fund
      - run: npm run build

  # Headline feature: real PDF/HTML via sibling DocEngine (not CI stubs).
  docengine-render:
    name: DocEngine real PDF render
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CoreEngine
        uses: actions/checkout@v4

      - name: Checkout DocEngine (sibling)
        uses: actions/checkout@v4
        with:
          repository: YuriiOsypov/docEngine
          path: _docEngine

      - name: Link DocEngine as sibling of the workspace
        run: ln -sfn "$GITHUB_WORKSPACE/_docEngine" "$(dirname "$GITHUB_WORKSPACE")/docEngine"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            _docEngine/package-lock.json
            crm-bff/package-lock.json

      - name: Install and build DocEngine packages
        working-directory: _docEngine
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          # engine first; editor ↔ pdf-renderer are mutual deps (workspace links).
          npm run build -w @docengine/engine
          npm run build -w @docengine/pdf-renderer
          npm run build -w @docengine/editor

      - name: Install BFF against real DocEngine (no stubs)
        working-directory: crm-bff
        run: npm install --no-audit --no-fund

      - name: Render a real PDF (and HTML)
        working-directory: crm-bff
        env:
          DOCENGINE_REAL_RENDER: '1'
        run: npm run test:docengine-render
