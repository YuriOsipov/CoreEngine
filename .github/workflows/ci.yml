name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  bff:
    name: BFF typecheck + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crm-bff
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: crm-bff/package-lock.json
      # Prefer published @docengine/*; fall back to in-repo stubs when not on npm yet.
      - name: Resolve DocEngine deps (npm or stubs)
        run: |
          if npm view @docengine/engine@$DOCENGINE_VERSION version >/dev/null 2>&1; then
            echo "Using npm @docengine/*@$DOCENGINE_VERSION"
          else
            echo "npm @docengine/*@$DOCENGINE_VERSION missing — using CI stubs"
            node ../scripts/use-docengine.mjs stub
          fi
        env:
          DOCENGINE_VERSION: '0.0.105'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  unit:
    name: App unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Resolve DocEngine deps (npm or stubs)
        run: |
          if npm view @docengine/editor@$DOCENGINE_VERSION version >/dev/null 2>&1; then
            echo "Using npm @docengine/*@$DOCENGINE_VERSION"
          else
            echo "npm @docengine/*@$DOCENGINE_VERSION missing — using CI stubs"
            node ./scripts/use-docengine.mjs stub
          fi
        env:
          DOCENGINE_VERSION: '0.0.105'
      - run: npm install --no-audit --no-fund
      - run: npm test

  build:
    name: App build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Resolve DocEngine deps (npm or stubs)
        run: |
          if npm view @docengine/editor@$DOCENGINE_VERSION version >/dev/null 2>&1; then
            echo "Using npm @docengine/*@$DOCENGINE_VERSION"
          else
            echo "npm @docengine/*@$DOCENGINE_VERSION missing — using CI stubs"
            node ./scripts/use-docengine.mjs stub
          fi
        env:
          DOCENGINE_VERSION: '0.0.105'
      - run: npm install --no-audit --no-fund
      - run: npm run build

  # Headline feature: real PDF/HTML (npm @docengine/* when published, else sibling checkout).
  docengine-render:
    name: DocEngine real PDF render
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CoreEngine
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: crm-bff/package-lock.json

      - name: Prefer npm DocEngine; else checkout sibling
        id: docengine_source
        run: |
          if npm view @docengine/pdf-renderer@$DOCENGINE_VERSION version >/dev/null 2>&1; then
            echo "mode=npm" >> "$GITHUB_OUTPUT"
            echo "Using npm @docengine/*@$DOCENGINE_VERSION"
          else
            echo "mode=sibling" >> "$GITHUB_OUTPUT"
            echo "npm package missing — will use sibling DocEngine checkout"
          fi
        env:
          DOCENGINE_VERSION: '0.0.105'

      - name: Checkout DocEngine (sibling fallback)
        if: steps.docengine_source.outputs.mode == 'sibling'
        uses: actions/checkout@v4
        with:
          repository: YuriiOsypov/docEngine
          path: _docEngine

      - name: Link DocEngine as sibling of the workspace
        if: steps.docengine_source.outputs.mode == 'sibling'
        run: ln -sfn "$GITHUB_WORKSPACE/_docEngine" "$(dirname "$GITHUB_WORKSPACE")/docEngine"

      - name: Install and build DocEngine packages
        if: steps.docengine_source.outputs.mode == 'sibling'
        working-directory: _docEngine
        run: |
          # Skip prepare until packages build in order (field-date needs engine first).
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts --no-audit --no-fund
          else
            npm install --ignore-scripts --no-audit --no-fund
          fi
          npm run build -w @docengine/engine
          npm run build -w @docengine/pdf-renderer
          npm run build -w @docengine/editor

      - name: Point BFF at sibling DocEngine
        if: steps.docengine_source.outputs.mode == 'sibling'
        run: node ./scripts/use-docengine.mjs local

      - name: Install BFF
        working-directory: crm-bff
        run: npm install --no-audit --no-fund

      - name: Render a real PDF (and HTML)
        working-directory: crm-bff
        env:
          DOCENGINE_REAL_RENDER: '1'
        run: npm run test:docengine-render
