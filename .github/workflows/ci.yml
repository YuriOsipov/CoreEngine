name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      use_docengine_stubs:
        description: 'Install @docengine/* from ci/stubs instead of the npm lockfile (explicit only; skips lockfile enforcement)'
        type: boolean
        default: false

# Stub fallback is opt-in only. A failed `npm view` / registry blip must not
# silently switch to ci/stubs and green the job on fake packages.
env:
  DOCENGINE_ALLOW_STUBS: ${{ inputs.use_docengine_stubs && 'true' || 'false' }}

jobs:
  bff:
    name: BFF typecheck + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crm-bff
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: crm-bff/package-lock.json
      - name: Install dependencies
        run: |
          if [ "$DOCENGINE_ALLOW_STUBS" = "true" ]; then
            echo "DOCENGINE_ALLOW_STUBS=true — using ci/stubs (npm install; lockfile not enforced)"
            node ../scripts/use-docengine.mjs stub
            npm install --no-audit --no-fund
          else
            echo "Installing lockfile @docengine/* via npm ci"
            npm ci --no-audit --no-fund
          fi
      - run: npm run typecheck
      - run: npm test

  unit:
    name: App unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: |
          if [ "$DOCENGINE_ALLOW_STUBS" = "true" ]; then
            echo "DOCENGINE_ALLOW_STUBS=true — using ci/stubs (npm install; lockfile not enforced)"
            node ./scripts/use-docengine.mjs stub
            npm install --no-audit --no-fund
          else
            echo "Installing lockfile @docengine/* via npm ci"
            npm ci --no-audit --no-fund
          fi
      - run: npm test

  build:
    name: App build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: |
          if [ "$DOCENGINE_ALLOW_STUBS" = "true" ]; then
            echo "DOCENGINE_ALLOW_STUBS=true — using ci/stubs (npm install; lockfile not enforced)"
            node ./scripts/use-docengine.mjs stub
            npm install --no-audit --no-fund
          else
            echo "Installing lockfile @docengine/* via npm ci"
            npm ci --no-audit --no-fund
          fi
      - run: npm run build
