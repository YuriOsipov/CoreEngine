name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  bff:
    name: BFF typecheck + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crm-bff
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: crm-bff/package-lock.json
      # Prefer published @docengine/*; fall back to in-repo stubs when not on npm yet.
      - name: Resolve DocEngine deps (npm or stubs)
        run: |
          if npm view @docengine/engine@$DOCENGINE_VERSION version >/dev/null 2>&1; then
            echo "Using npm @docengine/*@$DOCENGINE_VERSION"
          else
            echo "npm @docengine/*@$DOCENGINE_VERSION missing — using CI stubs"
            node ../scripts/use-docengine.mjs stub
          fi
        env:
          DOCENGINE_VERSION: '0.0.105'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  unit:
    name: App unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Resolve DocEngine deps (npm or stubs)
        run: |
          if npm view @docengine/editor@$DOCENGINE_VERSION version >/dev/null 2>&1; then
            echo "Using npm @docengine/*@$DOCENGINE_VERSION"
          else
            echo "npm @docengine/*@$DOCENGINE_VERSION missing — using CI stubs"
            node ./scripts/use-docengine.mjs stub
          fi
        env:
          DOCENGINE_VERSION: '0.0.105'
      - run: npm install --no-audit --no-fund
      - run: npm test

  build:
    name: App build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Resolve DocEngine deps (npm or stubs)
        run: |
          if npm view @docengine/editor@$DOCENGINE_VERSION version >/dev/null 2>&1; then
            echo "Using npm @docengine/*@$DOCENGINE_VERSION"
          else
            echo "npm @docengine/*@$DOCENGINE_VERSION missing — using CI stubs"
            node ./scripts/use-docengine.mjs stub
          fi
        env:
          DOCENGINE_VERSION: '0.0.105'
      - run: npm install --no-audit --no-fund
      - run: npm run build
