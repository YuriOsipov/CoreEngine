# Optional OIDC IdP for local SSO (Keycloak).
#
#   docker compose -f docker-compose.keycloak.yml --profile oidc up -d
#
# Then set in repo-root .env (see .env.example OIDC_* block):
#   OIDC_ENABLED=true
#   OIDC_ISSUER=http://localhost:8081/realms/coreengine
#   OIDC_CLIENT_ID=coreengine
#   OIDC_CLIENT_SECRET=coreengine-dev-client-secret-change-me
#   OIDC_REDIRECT_URI=http://localhost:4000/auth/oidc/callback
#   OIDC_UI_ORIGIN=http://localhost:5173
#
# Admin console: http://localhost:8081 (admin / admin — change in production).
# Dev user (matches provision email): admin@example.com / ChangeMeNow!
# Configure MFA in Keycloak (Authentication → OTP / WebAuthn) — CoreEngine does not implement TOTP.

services:
  keycloak:
    profiles: ["oidc"]
    image: quay.io/keycloak/keycloak:26.0
    command:
      - start-dev
      - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_PORT: 8080
      # Browser-facing issuer (host publish port). BFF uses OIDC_INTERNAL_ISSUER=http://keycloak:8080/...
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PUBLISH_PORT:-8081}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "127.0.0.1:${KEYCLOAK_PUBLISH_PORT:-8081}:8080"
    volumes:
      - ./docker/keycloak/realm-coreengine.json:/opt/keycloak/data/import/realm-coreengine.json:ro
    networks:
      - default
      - coreengine_default
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s

networks:
  coreengine_default:
    external: true
    name: coreengine_default
