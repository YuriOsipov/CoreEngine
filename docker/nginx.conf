server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Edge proxy: overwrite (never append to) client-supplied forwarding headers.
  # The BFF trusts these only from private-network peers (TRUST_PROXY).
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;

  # Defence in depth for record HTML rendered via v-html (sanitised client-side too).
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # SAMEORIGIN (not DENY): the app embeds /assets PDFs in same-origin iframes.
  add_header X-Frame-Options "SAMEORIGIN" always;
  # Ignored by browsers over plain HTTP; effective once TLS terminates in front of nginx.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location /graphql {
    proxy_pass http://bff:4000/graphql;
    client_max_body_size 20m;
  }

  location /api/ {
    proxy_pass http://bff:4000/api/;
    client_max_body_size 20m;
  }

  location /auth/ {
    proxy_pass http://bff:4000/auth/;
  }

  location /files {
    proxy_pass http://bff:4000/files;
    client_max_body_size 50m;
  }

  location /assets/ {
    proxy_pass http://bff:4000/assets/;
  }

  location /flows/ {
    proxy_pass http://bff:4000/flows/;
  }

  location /health {
    proxy_pass http://bff:4000/health;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
