server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /graphql {
    proxy_pass http://bff:4000/graphql;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass http://bff:4000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /auth/ {
    proxy_pass http://bff:4000/auth/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
  }

  location /files {
    proxy_pass http://bff:4000/files;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    client_max_body_size 50m;
  }

  location /assets/ {
    proxy_pass http://bff:4000/assets/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
  }

  location /flows/ {
    proxy_pass http://bff:4000/flows/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
  }

  location /health {
    proxy_pass http://bff:4000/health;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
